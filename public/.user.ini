; Forces PHP to check file modification times on every request instead of
; trusting opcache's compiled copy indefinitely. Without this, a re-deploy
; can silently keep running old code (this is what caused every CURA route
; except the homepage to 404 after a deploy — routes/web.php on disk was
; correct, but PHP was still executing an old compiled version from before
; most routes existed). PHP re-reads .user.ini files at most every
; user_ini.cache_ttl seconds (default 300), so this itself can take up to
; 5 minutes to take effect after upload — it's a fix for the *next* deploy,
; not this one.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
